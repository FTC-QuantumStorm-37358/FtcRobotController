apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    // Register shared folders directly in the Android module so Gradle and
    // Android Studio import the same source roots (no separate IDE marking).
    sourceSets {
        main {
            java.srcDir rootProject.file('simulator/robot/shared/src/main/java')
            java.srcDir rootProject.file('simulator/robot/ftc/src/main/java')
        }
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// Fail clearly if only the OpMode was copied instead of the complete repository.
def requiredBiobuzzSources = [
    'simulator/robot/shared/src/main/java/org/firstinspires/ftc/teamcode/biobuzz/RobotIO.java',
    'simulator/robot/shared/src/main/java/org/firstinspires/ftc/teamcode/biobuzz/FieldLayout.java',
    'simulator/robot/shared/src/main/java/org/firstinspires/ftc/teamcode/biobuzz/AutoStateMachine.java',
    'simulator/robot/ftc/src/main/java/org/firstinspires/ftc/teamcode/biobuzz/ftc/FtcRobotIO.java'
]
requiredBiobuzzSources.each { relativePath ->
    if (!rootProject.file(relativePath).isFile()) {
        throw new GradleException("Missing shared BIOBUZZ source: ${relativePath}. Open the complete FtcRobotController repository on the simulator branch, then sync Gradle.")
    }
}
